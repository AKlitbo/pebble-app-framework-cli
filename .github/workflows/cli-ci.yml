name: CLI CI

# paf's own checks, run on every PR and on main
# the tests, lint, and typecheck run through the framework's verify actions, which put each failure on its
# line in the PR and the totals on the job summary
on:
  pull_request:
    paths-ignore:
      - '**.md'
  push:
    branches: [main]
    paths-ignore:
      - '**.md'

# a PR's newer push makes its older run pointless. a push to main is left to finish, so a break shows on
# the commit that made it rather than on the one after
concurrency:
  group: cli-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  vitest:
    name: Test on Linux
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Test
        uses: AKlitbo/pebble-app-framework/.github/actions/verify-vitest@v3.0.0
        with:
          config: vitest.config.ts

  # paf runs on Windows as well, where git turns autocrlf on for the whole machine and npm starts
  # differently, so the specs run there too
  vitest-windows:
    name: Test on Windows
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Test
        run: npm test

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Lint
        uses: AKlitbo/pebble-app-framework/.github/actions/verify-eslint@v3.0.0
        with:
          config: eslint.config.ts

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck
        uses: AKlitbo/pebble-app-framework/.github/actions/verify-typecheck@v3.0.0
        with:
          projects: |
            tsconfig.json
            tsconfig.build.json
