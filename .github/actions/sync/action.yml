name: paf Sync
description: >
  Installs paf at this action's tag and fills the paf/ folder of a face repo's units with paf sync
  --locked, so the build that follows uses exactly the framework, plugins, and lock each unit committed.
  Given a face, only the unit that face builds from is filled.

inputs:
  face:
    description: A face, to fill only the unit it builds from. Empty fills every unit in the repo.
    required: false
    default: ''
  node-version:
    description: >
      The Node version to install. paf and the framework's tools run under it too, so it has to be inside
      the range engines.node names in paf/package.json, which on framework 4 is 22.18 or later on Node 22,
      or 24.2 or later. A unit's framework records the Node major it is built with in paf/toolchain.json,
      and keeping this the same keeps the install on the Node the framework was tested with.
    required: false
    default: '24'

runs:
  using: composite
  steps:
    - name: Setup Node
      uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node-version }}

    # the action's own folder is this repo at the tag the workflow names, so paf is built and installed
    # from there rather than fetched again. npm ci builds dist/ through the prepare script
    - name: Install paf
      shell: bash
      working-directory: ${{ github.action_path }}/../../..
      run: |
        npm ci --no-audit --no-fund
        npm install --global --no-audit --no-fund .

    # the face goes as one argument, and none at all when it is empty
    - name: Sync the Framework
      shell: bash
      env:
        FACE: ${{ inputs.face }}
      run: paf sync --locked ${FACE:+"$FACE"}
